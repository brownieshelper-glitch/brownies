# The tests run on every pull request and on main. Patch, the quality brownie, waits for these checks before a
# change Chip wrote is merged by itself; a red check blocks the merge and sends the change to the owner.
name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  helpers:
    name: helpers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            helpers/package-lock.json
            gateway/package-lock.json
      - run: npm ci
        working-directory: helpers
      # the shop's tests use the gateway's x402 code, whose packages (ethers) live in gateway/
      - run: npm ci
        working-directory: gateway
      - run: npm test
        working-directory: helpers

  gateway:
    name: gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
        working-directory: gateway
      - run: node --test test/core.test.mjs test/team.test.mjs test/keeper.test.mjs test/grants.test.mjs test/x402.test.mjs test/ambient.test.mjs test/bridge.test.mjs
        working-directory: gateway

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # the contracts are built and tested when their own files change (src, test, script, lib, the Foundry files), so a
      # change to the facts or to the helpers is not held up by them; a push with no earlier commit to compare runs them
      - id: changed
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then echo "contracts=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$base" HEAD | grep -qE '^(src/|test/|script/|lib/|foundry\.toml$|remappings\.txt$)'; then echo "contracts=true" >> "$GITHUB_OUTPUT"; else echo "contracts=false" >> "$GITHUB_OUTPUT"; echo "no contract file changed: the contracts are not built"; fi
      - if: steps.changed.outputs.contracts == 'true'
        uses: foundry-rs/foundry-toolchain@v1
      - if: steps.changed.outputs.contracts == 'true'
        run: forge install foundry-rs/forge-std transmissions11/solmate Uniswap/v4-core --no-git
      - if: steps.changed.outputs.contracts == 'true'
        run: forge build
      - if: steps.changed.outputs.contracts == 'true'
        run: forge test --no-match-path "test/Fork_*"
