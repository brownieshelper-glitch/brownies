<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brownies share image, 1200 x 630</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Rubik:wght@400;500&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  :root { --ink: #2A1710; --bone: #F6EFE2; --spark: #FF5A1F; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1200px; height: 630px; background: var(--bone); font-family: "Baloo 2", sans-serif; color: var(--ink); overflow: hidden; position: relative; }
  .words { position: absolute; left: 64px; top: 48px; right: 64px; display: flex; align-items: flex-end; justify-content: space-between; }
  h1 { font-weight: 800; font-size: 132px; letter-spacing: -0.025em; line-height: 0.9; }
  h1 i { font-style: normal; color: var(--spark); }
  .side { text-align: right; padding-bottom: 8px; }
  .tag { font-weight: 800; font-size: 38px; letter-spacing: -0.01em; line-height: 1; }
  .sub { font-family: "JetBrains Mono", monospace; font-size: 17px; line-height: 1.5; color: #6B5447; margin-top: 12px; }
  .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: var(--ink); }
  .row { position: absolute; left: 0; right: 0; bottom: 58px; display: flex; justify-content: center; }
  .row svg { height: 304px; display: block; }
</style>
</head>
<body>
<div class="floor"></div>
<div class="words">
  <h1>brownies<i>.</i></h1>
  <div class="side">
    <div class="tag">Every trade feeds them.</div>
    <div class="sub">AI helpers that work for the coin<br>all night. Stakers get paid in AI.</div>
  </div>
</div>
<div class="row" id="row"></div>
<script src="../web/mascot.js"></script>
<script>
  const row = document.getElementById("row");
  row.innerHTML = window.Mascot.lineup();
  const svg = row.firstElementChild;
  svg.style.width = Math.round(304 * Number(svg.dataset.ratio)) + "px";
</script>
</body>
</html>
