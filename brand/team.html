<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brownies, the team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Rubik:wght@400;500&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  :root { --ink: #2A1710; --bone: #F6EFE2; --spark: #FF5A1F; --muted: #6B5447; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1600px; height: 1340px; background: #E4DFD3; font-family: "Baloo 2", sans-serif; color: var(--ink); overflow: hidden; padding: 36px; }
  .head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 22px; }
  .head h1 { font-weight: 800; font-size: 64px; letter-spacing: -0.05em; line-height: 1; }
  .head h1 i { font-style: normal; color: var(--spark); }
  .head p { font-family: "JetBrains Mono", monospace; font-size: 16px; color: #6B5447; }
  .team { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  .card { background: var(--bone); border-radius: 8px; padding: 6px 22px 24px; }
  .card svg { width: 100%; height: auto; display: block; }
  .card h2 { font-weight: 800; font-size: 46px; letter-spacing: -0.02em; line-height: 1; margin-top: 6px; }
  .card .job { font-family: "JetBrains Mono", monospace; font-size: 15px; color: #C7400F; margin-top: 8px; font-weight: 500; }
  .card p { font-size: 20px; line-height: 1.35; color: var(--muted); margin-top: 8px; }
  .lower { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
  .box { border-radius: 8px; padding: 24px 28px; display: flex; align-items: center; gap: 24px; }
  .dark { background: #151513; }
  .light { background: var(--bone); }
  .coin { border-radius: 50%; overflow: hidden; flex: none; }
  .coin svg { width: 100%; height: 100%; display: block; }
  .box .t { font-family: "JetBrains Mono", monospace; font-size: 15px; line-height: 1.6; color: #C9B8A8; margin-left: 8px; }
  .light .t { color: #6B5447; }
  .banner { margin-top: 20px; border-radius: 8px; overflow: hidden; height: 509px; }
  .banner iframe { width: 1500px; height: 500px; border: 0; display: block; transform-origin: 0 0; transform: scale(1.0187); }
</style>
</head>
<body>
<div class="head"><h1>brownies<i>.</i></h1><p>the four helpers, the coin logo, the banner</p></div>
<div class="team" id="team"></div>
<div class="lower">
  <div class="box dark">
    <div class="coin" data-coin="orange" style="width:150px;height:150px"></div>
    <div class="coin" data-coin="orange" style="width:84px;height:84px"></div>
    <div class="coin" data-coin="orange" style="width:44px;height:44px"></div>
    <div class="coin" data-coin="orange" style="width:24px;height:24px"></div>
    <div class="t">coin logo A, orange coin<br>on a dark page</div>
  </div>
  <div class="box light">
    <div class="coin" data-coin="orange" style="width:150px;height:150px"></div>
    <div class="coin" data-coin="orange" style="width:84px;height:84px"></div>
    <div class="coin" data-coin="orange" style="width:44px;height:44px"></div>
    <div class="coin" data-coin="orange" style="width:24px;height:24px"></div>
    <div class="t">the same<br>on a light page</div>
  </div>
</div>
<div class="banner"><iframe src="banner.html"></iframe></div>
<script src="../web/mascot.js"></script>
<script>
  const B = window.Mascot;
  document.getElementById("team").innerHTML = B.team.map((h) =>
    `<div class="card">${B.svg({ ...h, label: h.name })}<h2>${h.name}</h2><div class="job">${h.job}</div><p>${h.line}</p></div>`).join("");
  for (const el of document.querySelectorAll("[data-coin]")) el.innerHTML = B.coin();
</script>
</body>
</html>
