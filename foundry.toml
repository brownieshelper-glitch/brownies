[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Relative remappings only (remappings.txt), so the same source gives the same bytecode in any folder and Sourcify
# verification never publishes a local path. Same rule as helix-hook.
auto_detect_remappings = false
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
ffi = false
fs_permissions = [{ access = "read", path = "./"}, { access = "read-write", path = "./web/deployments" }]

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
